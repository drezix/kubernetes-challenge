apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: kubernetes-challenge
  labels:
    app: postgrest
spec:
  # Stateless: any replica can serve any request
  replicas: 3
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: admin
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: PGRST_DB_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_DB_SCHEMAS
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_DB_ANON_ROLE
            - name: PGRST_ADMIN_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_ADMIN_SERVER_PORT
            - name: PGRST_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PGRST_LOG_LEVEL
            # $(VAR) is expanded by Kubernetes from the variables above,
            # so the password is never written in this file
            - name: PGRST_DB_URI
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)
          # Liveness: is the process alive? Failing it restarts the container.
          livenessProbe:
            httpGet:
              path: /live
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: can it serve now (DB connected, schema cache loaded)?
          # Failing it only removes the Pod from the Service endpoints.
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
