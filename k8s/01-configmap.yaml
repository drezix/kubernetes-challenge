# Non-sensitive configuration. Credentials live in the postgres-secret Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kubernetes-challenge
data:
  POSTGRES_DB: challenge
  PGDATA: /var/lib/postgresql/data/pgdata
  # Service name of the database: resolved by the cluster DNS, never a Pod IP
  DB_HOST: postgres
  PGRST_DB_SCHEMAS: api
  PGRST_DB_ANON_ROLE: web_anon
  # Admin server with the /live and /ready endpoints used by the probes
  PGRST_ADMIN_SERVER_PORT: "3001"
  # info logs every request, which shows the load balancing between replicas
  PGRST_LOG_LEVEL: info
