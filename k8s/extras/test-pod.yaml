# Bare Pod with no owner (no Deployment/ReplicaSet).
# Used in Level 1 to show that a deleted bare Pod is not recreated.
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: kubernetes-challenge
  labels:
    app: test-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
